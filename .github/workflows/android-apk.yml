
name: Build Ritmo Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and Validate Ritmo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and regression tests
        run: npm run lint && npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Prepare private release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RITMO_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RITMO_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/ritmo-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "RITMO_RELEASE_STORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Debug APK for pull requests
        if: github.event_name == 'pull_request'
        working-directory: android
        run: chmod +x gradlew && ./gradlew test assembleDebug --stacktrace

      - name: Build signed Release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          RITMO_RELEASE_STORE_PASSWORD: ${{ secrets.RITMO_STORE_PASSWORD }}
          RITMO_RELEASE_KEY_ALIAS: ${{ secrets.RITMO_KEY_ALIAS }}
          RITMO_RELEASE_KEY_PASSWORD: ${{ secrets.RITMO_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RITMO_RELEASE_STORE_FILE"
          test -n "$RITMO_RELEASE_STORE_PASSWORD"
          test -n "$RITMO_RELEASE_KEY_ALIAS"
          test -n "$RITMO_RELEASE_KEY_PASSWORD"

          chmod +x gradlew
          ./gradlew test assembleRelease --stacktrace

      - name: Verify Release APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found: $APK"
            find android/app/build/outputs -name '*.apk' || true
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          cp "$APK" android/app/build/outputs/apk/release/ritmo-1.1.6-release.apk

      - name: Prepare Debug APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ritmo-debug.apk

      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-debug-apk
          path: artifacts/ritmo-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-1.1.6-release-apk
          path: android/app/build/outputs/apk/release/ritmo-1.1.6-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always() && runner.os == 'Linux'
        shell: bash
        run: rm -f "$RUNNER_TEMP/ritmo-release.jks"
