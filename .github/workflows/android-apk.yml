name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Type check and regression tests
        run: npm run lint && npm test

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available.
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew test assembleDebug --stacktrace

      - name: Validate and Prepare APK Artifact
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="android/app/build/outputs/apk/debug/ritmo-1.1.6-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Build succeeded but output APK not found at $APK_SOURCE"
            echo "Searching for any generated .apk files in android/app/build/:"
            find android/app/build -name "*.apk" || true
            exit 1
          fi

          cp "$APK_SOURCE" "$APK_DEST"

          echo "=========================================="
          echo "APK generated successfully:"
          ls -lh "$APK_DEST"
          echo "SHA256: $(sha256sum "$APK_DEST" | awk '{print $1}')"
          echo "=========================================="

      - name: Upload Ritmo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-android-apk
          path: android/app/build/outputs/apk/debug/ritmo-1.1.6-debug.apk
          if-no-files-found: error
          retention-days: 30
